# MySQL for Taikon Motorparts.
#
#   docker compose up -d        # start (first run creates tables + sample catalogue)
#   docker compose down         # stop, keep data
#   docker compose down -v      # stop and DELETE all data (next start re-seeds)
#
# Credentials come from .env (the same file the PHP app reads).

services:
  db:
    image: mysql:8.4
    container_name: taikon-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-taikon_motorparts}
      MYSQL_USER: ${DB_USERNAME:-taikon}
      MYSQL_PASSWORD: ${DB_PASSWORD:-taikon_secret}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root_secret}
      TZ: Asia/Kuala_Lumpur
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+08:00
    ports:
      - "127.0.0.1:${DB_PORT:-3307}:3306"
    volumes:
      - db_data:/var/lib/mysql
      # Run once, in name order, only when the data volume is empty.
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./database/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

volumes:
  db_data:
